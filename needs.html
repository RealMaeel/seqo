<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<!-- Everything SEQO shows is local: no remote scripts, frames or fetches from the page.
     Network access stays in the main process. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; media-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>SEQO — Zone needs</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: #14141c; overflow: hidden;
               font-family: 'Segoe UI', sans-serif; user-select: none; color: #ddd; }
  body { display: flex; flex-direction: column; border: 1px solid rgba(255,215,102,.25); border-radius: 0 0 8px 8px; }
  body.large { font-size: 115%; }

  #topbar { flex: none; display: flex; align-items: center; gap: 6px; padding: 3px 8px;
            background: rgba(255,255,255,.04); border-bottom: 1px solid rgba(255,255,255,.08);
            -webkit-app-region: drag; }
  #topbar > * { -webkit-app-region: no-drag; }
  #title { color: #ffd766; font-weight: 600; font-size: 11.5px; flex: 1;
           overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
           -webkit-app-region: drag; }
  .tbtn { background: none; border: none; color: #aaa; font-size: 13px; cursor: pointer;
          width: 22px; height: 20px; border-radius: 4px; flex: none; }
  .tbtn:hover { background: rgba(255,255,255,.12); color: #fff; }
  #btn-pin.detached { color: #7dffa0; }

  #list { flex: 1; min-height: 0; overflow-y: auto; padding: 2px 6px 5px; }
  #list::-webkit-scrollbar { width: 7px; }
  #list::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 4px; }

  .grp { color: #889; font-size: 9.5px; letter-spacing: .4px; margin: 4px 2px 1px;
         border-bottom: 1px solid rgba(255,255,255,.07); }
  body.large .grp { font-size: 11px; }
  .row { display: flex; align-items: baseline; gap: 6px; padding: 1px 3px; font-size: 10.5px;
         border-radius: 4px; cursor: pointer; }
  body.large .row { font-size: 12.5px; padding: 2px 3px; }
  .row:hover { background: rgba(255,255,255,.06); }
  .row .nm { color: #ffd766; flex: none; max-width: 46%; overflow: hidden;
             text-overflow: ellipsis; white-space: nowrap;
             text-decoration: underline dotted rgba(255,215,102,.35); text-underline-offset: 2px; }
  .row .cnt { color: #7dffa0; font-variant-numeric: tabular-nums; flex: none; }
  .row .mobs { color: #8fa9c7; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .star { flex: none; cursor: pointer; color: #ffd766; padding: 0 2px; }
  .row.flash { animation: needflash 2.2s; }
  @keyframes needflash { 0%, 40% { background: rgba(125,255,160,.28); } 100% { background: transparent; } }

  #empty { color: #778; font-size: 10.5px; text-align: center; margin-top: 14px; padding: 0 10px; line-height: 1.5; }

  /* minimized: a single summary line */
  body.min #list, body.min #empty { display: none; }
  body.min { border-radius: 0 0 8px 8px; }
  body.min #topbar { border-bottom: none; cursor: pointer; }
</style>
</head>
<body>
  <div id="topbar">
    <span id="title">🎯 Zone needs</span>
    <button class="tbtn" id="btn-pin" title="Detach from the overlay (drag the title to move it) / re-attach">📌</button>
    <button class="tbtn" id="btn-min" title="Minimize to a one-line bar">—</button>
    <button class="tbtn" id="btn-close" title="Close the needs panel (the Loot tab's 🎯 Needs button reopens it)">✕</button>
  </div>
  <div id="list"></div>
  <div id="empty" style="display:none"></div>

<script src="ui/needs.js"></script>
</body>
</html>
